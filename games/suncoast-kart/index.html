<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Suncoast Kart — 3D Online Arcade Kart Racer</title>
    <meta
      name="description"
      content="Race across Suncoast Grand Circuit in a vibrant 3D low-poly kart racer with drift mini-turbos, item boxes, jump tricks, shortcuts, and online multiplayer rooms."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=JetBrains+Mono:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      if (new URLSearchParams(window.location.search).get('autostart') === '1') {
        document.documentElement.classList.add('autostart-boot');
      }
    </script>
    <script src="../../shared/ws-relay.js"></script>
    <script src="../../shared/accounts.js"></script>
    <script src="../../shared/room-sync.js"></script>
    <script type="module" crossorigin src="./assets/index-DcIiVWyl.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DXxdBxG8.css">
    <style>
      .touch-controls,
      .touch-controls button,
      #touch-left,
      #touch-right,
      #touch-drift,
      #touch-item {
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" class="boot-splash" aria-live="polite">
      <div class="boot-splash-card">
        <div class="boot-splash-icon">🏎️</div>
        <h2>Revving Engines...</h2>
        <p>Syncing karts on Suncoast Grand Circuit!</p>
      </div>
    </div>
    <main id="app">
      <div id="canvas-mount" aria-label="3D Kart Race Viewport"></div>
      <div id="ui-root"></div>
      <div id="sk-vet-pill" style="position:fixed; top:max(10px, env(safe-area-inset-top)); left:50%; transform:translateX(-50%); z-index:45; display:none; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; background:#fffbeb; color:#1e1b2e; border:2.5px solid #1e1b2e; box-shadow:0 3px 0 #1e1b2e; font-family:'Fredoka',system-ui,sans-serif; font-size:0.8rem; font-weight:700; pointer-events:none;"></div>
    </main>
    <script>
      (function () {
        if (!window.CouchAccounts || !window.CouchAccounts.startVeteranSession) return;
        const pill = document.getElementById('sk-vet-pill');
        function renderVet(rank) {
          if (!pill || !rank) return;
          const prof = window.CouchAccounts.getPublicProfile('suncoast-kart');
          const name = (prof && prof.username) || (window.CouchRoom && window.CouchRoom.getSavedPlayerName()) || 'Racer';
          pill.style.display = 'inline-flex';
          pill.style.background = rank.bg || '#fffbeb';
          pill.innerHTML = '<span>' + rank.badge + '</span><span>' + name + ' · ' + rank.title + '</span><span style="color:' + rank.color + ';">' + rank.points + ' VP</span>';
        }
        renderVet(window.CouchAccounts.getVeteranStats('suncoast-kart'));
        window.CouchAccounts.startVeteranSession(
          'suncoast-kart',
          () => document.visibilityState === 'visible',
          { onUpdate: renderVet }
        );
      })();
    </script>
  </body>
</html>
